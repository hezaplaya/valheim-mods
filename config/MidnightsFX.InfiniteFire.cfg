[Smoke gameplay]

## Smoke applies the Smoked status effect (2 damage per second) to anyone standing in it. Set false to make every character - players, tames and monsters - ignore smoke completely, which also skips the smoke proximity check each of them runs every 2 seconds.
# Setting type: Boolean
# Default value: true
SmokeDamage = true

## Smoke can choke fires. Set false so fireplaces are never reported as blocked by their own smoke, smelters, kilns and blast furnaces never stall on smoke, and spreading fires are never put out by it. Spreading fires still expire after 30 seconds and still die in the rain.
# Setting type: Boolean
# Default value: true
SmokeSuffocation = true

