[off_schedule]

## How many in game seconds pass before a scheduled fire rechecks the clock. A Valheim day is 1200 seconds and the clock runs faster at night, an hour after dark being 30 seconds against 70 in daylight, so 10 puts a boundary up to about 20 in game minutes late at night and 9 by day. Lower is near enough free, the check is a handful of comparisons and only runs while a fire is loaded.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 120
ScheduleCheckInterval = 10

